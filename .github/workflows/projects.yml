name: Projects

# Runs the hax pipeline of the projects that use hax against the hax in this
# checkout. The projects are listed in `.github/hax-projects.json`: each has a
# `backend` (`fstar` when unset, or `proverif`), a `repository` and optionally
# a `ref` to check out (its default branch otherwise), the `directory` to run
# in, and the commands of its stages: `extract`, and optionally `lax` and
# `prove`. For F*, `lax` lax-checks and `prove` proves; for ProVerif, `lax`
# checks that the model loads and `prove` runs the analysis and checks its
# verdicts. A project without a `lax` command only extracts at that stage.
#
# The nightly runs in pereq-dev/hax only; any repository with this workflow can
# dispatch it.

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      projects:
        description: >-
          Which projects to run: a comma-separated list of names from
          .github/hax-projects.json, or "all".
        default: all
      hax-ref:
        description: >-
          The hax branch, tag or commit to test. Defaults to the ref this
          run was dispatched from.
        default: ''
      project-ref:
        description: >-
          The branch, tag or commit of the project repositories: one for every
          selected project, or comma-separated `name=ref` pairs. A project
          without one uses the `ref` of .github/hax-projects.json, or else its
          default branch.
        default: ''
      stage:
        description: >-
          How far to go, overriding the `stage` each project sets for itself:
          "extract", "lax" or "prove" for the full proofs.
        type: choice
        options: [project default, extract, lax, prove]
        default: project default

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{ inputs.projects }}
    -${{ inputs.hax-ref }}-${{ inputs.project-ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name != 'schedule' || github.repository == 'pereq-dev/hax'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.hax-ref }}

      - id: plan
        env:
          PROJECTS: ${{ inputs.projects || 'all' }}
          PROJECT_REF: ${{ inputs.project-ref }}
        run: |
          set -euo pipefail
          list() {
            jq -cn --arg s "$1" \
              '$s | split(",") | map(sub("^ +";"") | sub(" +$";"")) | map(select(. != ""))'
          }
          names=$(list "$PROJECTS")
          # Either one ref for every project, or `name=ref` pairs.
          refs=$(list "$PROJECT_REF" | jq -c '
            if all(contains("=")) then
              {pairs: map(split("=") | {key: .[0], value: (.[1:] | join("="))})
                      | from_entries}
            elif length == 1 then {all: .[0]}
            else "project-ref: give one ref, or only name=ref pairs" | halt_error
            end')
          matrix=$(jq -c --argjson names "$names" --argjson refs "$refs" '
            [.[].name] as $known
            | ($names - ["all"]) as $requested
            | ($requested - $known) as $unknown
            | ((($refs.pairs // {}) | keys) - $known) as $unknown_refs
            | if ($unknown | length) > 0 then
                ("unknown project(s): " + ($unknown | join(", "))
                  + ". Known projects: " + ($known | join(", "))) | halt_error
              elif ($unknown_refs | length) > 0 then
                ("project-ref names unknown project(s): "
                  + ($unknown_refs | join(", "))) | halt_error
              else
                map(.backend //= "fstar"
                    | .ref = ($refs.pairs[.name] // $refs.all // .ref // ""))
                | if ($names | index("all")) then {include: .}
                  else {include: [.[] | select(.name | IN($requested[]))]}
                  end
              end
          ' .github/hax-projects.json)
          if [ "$(jq '.include | length' <<< "$matrix")" -eq 0 ]; then
            echo "::error::no project selected by '$PROJECTS'"
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          jq '.include | map({name, ref})' <<< "$matrix"

  run:
    needs: plan
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}

    permissions:
      contents: read
      issues: write

    env:
      CARGO_TERM_COLOR: always
      STAGE: >-
        ${{ (inputs.stage == '' || inputs.stage == 'project default')
        && matrix.stage || inputs.stage }}
      # Bertie's F* makefiles take the proof libraries from here; libcrux's
      # take them from `cargo metadata`, which the injection points here.
      HAX_HOME: ${{ github.workspace }}/hax

    steps:
      - name: Free disk space by removing preinstalled packages
        uses: jlumbroso/free-disk-space@main

      - name: Check out hax
        id: hax
        uses: actions/checkout@v4
        with:
          path: hax
          ref: ${{ inputs.hax-ref }}

      - name: Check out ${{ matrix.repository }}
        id: project
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          path: project
          ref: ${{ matrix.ref }}

      - if: runner.environment == 'github-hosted'
        uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: hax
          skipPush: true
          extraPullNames: fstar-nix-versions, z3-nix-versions

      - name: Build and install hax
        run: nix profile install ./hax

      - name: Install F* ${{ matrix.fstar }}
        if: matrix.backend == 'fstar'
        env:
          VERSION: ${{ matrix.fstar }}
        run: |
          set -euo pipefail
          url="https://github.com/FStarLang/FStar/releases/download/$VERSION/fstar-$VERSION-Linux-x86_64.tar.gz"
          if curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
              -o /tmp/fstar.tar.gz "$url"; then
            mkdir -p "$HOME/.fstar"
            tar -xzf /tmp/fstar.tar.gz -C "$HOME/.fstar" --strip-components=2
            echo "$HOME/.fstar/bin" >> "$GITHUB_PATH"
          else
            echo "::notice::no prebuilt F* $VERSION for this platform; building it"
            nix profile install "github:FStarLang/FStar/$VERSION"
          fi

      # Separate, so the `PATH` the step above exported is in effect.
      - name: Locate the F* installation
        if: matrix.backend == 'fstar'
        run: |
          set -euo pipefail
          home="$(cd "$(dirname "$(command -v fstar.exe)")/.." && pwd)"
          echo "FSTAR_HOME=$home" >> "$GITHUB_ENV"
          fstar.exe --version

      - name: Install ProVerif
        if: matrix.backend == 'proverif'
        run: nix profile install ./hax#proverif

      - name: Install ${{ matrix.packages }}
        if: matrix.packages != ''
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          sudo apt-get update
          sudo apt-get install -y $PACKAGES

      # The directory the run uses, not the checkout root: cargo looks for the
      # workspace from there, as the project's own scripts do.
      - name: Use the hax-lib from this checkout
        uses: ./hax/.github/actions/use-local-hax-lib
        with:
          project: project/${{ matrix.directory }}
          hax: hax

      - name: Extract
        id: extract
        working-directory: project/${{ matrix.directory }}
        run: ${{ matrix.extract }}

      # One or the other, never both: an F* run leaves `.checked` files a
      # later `make` treats as done.
      - name: Lax-check
        id: lax
        if: env.STAGE == 'lax' && matrix.lax != ''
        working-directory: project/${{ matrix.directory }}
        run: ${{ matrix.lax }}

      - name: Prove
        id: prove
        if: env.STAGE == 'prove'
        working-directory: project/${{ matrix.directory }}
        run: ${{ matrix.prove }}

      - name: Open an issue for a failing nightly
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: ./hax/.github/actions/open-issue-once
        env:
          GH_TOKEN: ${{ github.token }}
          # The workspace root is not a checkout, so `gh` cannot find the
          # repository on its own.
          GH_REPO: ${{ github.repository }}
        with:
          label: ci
          title: Nightly hax run of ${{ matrix.name }} is failing
          body: |-
            The nightly [Projects](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) run of `${{ matrix.name }}` failed.

            | | |
            |---|---|
            | hax | [`${{ steps.hax.outputs.commit }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ steps.hax.outputs.commit }}) |
            | ${{ matrix.repository }} | [`${{ steps.project.outputs.commit }}`](${{ github.server_url }}/${{ matrix.repository }}/commit/${{ steps.project.outputs.commit }}) |
            | backend | `${{ matrix.backend }}` |
            | extraction | `${{ steps.extract.outcome }}` |
            | lax-check | `${{ env.STAGE == 'lax' && steps.lax.outcome || 'not requested' }}` |
            | proofs | `${{ env.STAGE == 'prove' && steps.prove.outcome || 'not requested' }}` |

            A requested stage reported as `skipped` did not run because
            something before it failed — the setup steps included; the run's
            log says which. A cancelled run has hit its timeout.

            To reproduce, or to test a fix in either repository:

            ```
            gh workflow run projects.yml \
              -f projects=${{ matrix.name }} \
              -f hax-ref=<hax branch> \
              -f project-ref=${{ matrix.name }}=<${{ matrix.repository }} branch>
            ```

name: Docs Playwright
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  test:
    name: "docs-playwright: test"
    if: github.repository == 'pereq-dev/hax'
    permissions:
      contents: read
      issues: write
    timeout-minutes: 90
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: DeterminateSystems/determinate-nix-action@v3
    - uses: cachix/cachix-action@v15
      with:
        name: hax
        skipPush: true
    - uses: actions/setup-node@v5
      with:
        node-version: lts/*
    - name: Install dependencies
      working-directory: docs/.test
      run: npm ci
    - name: Install Playwright Browsers
      working-directory: docs/.test
      run: npx playwright install --with-deps
    - name: Replace version with commit hash
      run: |
        js=hax_playground.js
        grep -q 'const HAX_PLAYGROUND_FORCED_VERSION = false;' "$js" \
          || { echo "::error::no HAX_PLAYGROUND_FORCED_VERSION line to replace in $js"; exit 1; }
        sed -i "s/const HAX_PLAYGROUND_FORCED_VERSION = false;/const HAX_PLAYGROUND_FORCED_VERSION = \"${GITHUB_SHA}\";/" "$js"
      working-directory: docs/javascripts
    - name: Playground warmup and build docs
      run: |
        set -euo pipefail

        nix build .#docs & pid1=$!
        curl -fsS --max-time 1200 "https://hax-playground.cryspen.com/query/$GITHUB_SHA/fstar+tc" \
          -X POST \
          -H 'User-Agent: bot' \
          -H 'Accept: application/json' \
          -H 'Content-Type: application/json' \
          --data-raw '[["src/lib.rs","fn f(){}"]]' & pid2=$!

        wait $pid1 || exit_code1=$?
        wait $pid2 || exit_code2=$?

        exit $(( ${exit_code1:-0} != 0 ? ${exit_code1:-0} : ${exit_code2:-0} ))
    - name: Run Playwright tests
      working-directory: docs/.test
      run: npx playwright test --reporter github,html
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: docs/.test/playwright-report/
        retention-days: 30
    - name: Open an issue on failure
      if: failure() && github.event_name == 'schedule'
      uses: ./.github/actions/open-issue-once
      env:
        GH_TOKEN: ${{ github.token }}
      with:
        label: tests
        title: Scheduled Playwright docs tests are failing
        body: |-
          The scheduled [Docs Playwright](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) run failed on `${{ github.sha }}`.

          Download the `playwright-report` artifact from that run to see which checks failed.

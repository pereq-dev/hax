name: Core models

# Both extractions run through `cargo hax`, built from this checkout — the
# Lean one via the charon and aeneas versions it pins. Any change to hax can
# therefore move the extraction, hence the broad paths of the `changes` job.
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  merge_group:

defaults:
  run:
    working-directory: hax-lib/core-models

jobs:
  changes:
    name: "core-models: changes"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    outputs:
      relevant: ${{ steps.diff.outputs.relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          # For a pull request, the merge commit and both of its parents.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      # The base is the target branch of a pull request, the previous tip of
      # a pushed branch, and for a merge queue entry the current tip of the
      # target branch rather than the entry's own base, so that the diff also
      # covers the entries ahead of it in the queue, which may merge on the
      # strength of this entry's checks. A failing fetch or diff marks the
      # change relevant rather than skipping the checks.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.event.merge_group.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          base=
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            merge_group) git fetch --depth=1 origin "$BASE_REF" && base=FETCH_HEAD ;;
            push) git fetch --depth=1 origin "$BEFORE" && base=$BEFORE ;;
          esac
          if [ -z "$base" ] || ! git diff --quiet "$base" HEAD -- \
            hax-lib \
            hax-types \
            hax-lib-protocol \
            hax-lib-protocol-macros \
            cli \
            engine \
            rust-engine \
            frontend \
            Cargo.toml \
            Cargo.lock \
            rustfmt.toml \
            .cargo \
            flake.nix \
            flake.lock \
            rust-toolchain.toml \
            .github/workflows/core-models.yml
          then
            echo relevant=true >> "$GITHUB_OUTPUT"
          else
            echo relevant=false >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------- formatting
  rust-fmt:
    name: "core-models: fmt"
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Assigned before being written out, so that a failure fails the step.
      - name: Resolve the hax toolchain
        run: |
          toolchain=$(tools/toolchain.sh hax)
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt

      - run: cargo fmt -- --check

      # `tests/` is a separate workspace; `cargo fmt` from the
      # root doesn't reach it.
      - run: cargo fmt -- --check
        working-directory: hax-lib/core-models/tests

  # ---------------------------------------------------------------- rust tests
  # The models must build under both toolchains client code is compiled with:
  # hax's, for the F* extraction, and the pinned charon's, for the Lean one.
  rust-test:
    name: "core-models: test (${{ matrix.toolchain }})"
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: [hax, charon]
    steps:
      - uses: actions/checkout@v5

      # Assigned before being written out, so that a failure fails the step.
      - name: Resolve the ${{ matrix.toolchain }} toolchain
        run: |
          toolchain=$(tools/toolchain.sh ${{ matrix.toolchain }})
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - run: cargo test --workspace
        env:
          RUSTFLAGS: "" # disable `cfg(hax)` from `.cargo/config.toml`

      # Both crates have cfg-exclusive models the default-cfg run can't reach.
      # F* clients are only ever compiled with hax's toolchain.
      - run: cargo test -p alloc
        if: matrix.toolchain == 'hax'
        env:
          RUSTFLAGS: "--cfg hax_backend_fstar"

      - run: cargo test -p core-models
        if: matrix.toolchain == 'hax'
        env:
          RUSTFLAGS: "--cfg hax_backend_fstar"

      # NOTE: the `tests/` workspace (client_test + rust_lean_equiv_test)
      # has already been refactored to use `cargo hax into lean`. That is
      # why it is part of the `core-models-tests` job below.

  # ------------------------------------------------------------- test coverage
  # Every line of the model must be exercised by the test suite. An item that
  # cannot be (a `panic!()`-bodied intrinsic, say) is marked
  # `#[cfg_attr(coverage_nightly, coverage(off))]` at the item, so this gate is
  # an absolute 100% and needs no threshold or baseline file.
  #
  # Only under hax's toolchain: other rustc versions instrument a few regions
  # differently (`for` desugaring, `format!` arguments) without any line or
  # function being missed.
  test-coverage:
    name: "core-models: coverage"
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Assigned before being written out, so that a failure fails the step.
      - name: Resolve the hax toolchain
        run: |
          toolchain=$(tools/toolchain.sh hax)
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: llvm-tools-preview

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - run: make test-coverage-check

  # ----------------------------------------------------------- lean extraction
  lean-build:
    name: "core-models: lean"
    runs-on: ubuntu-latest
    needs: [changes, rust-fmt]   # don't waste cycles on a formatting-broken PR
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v5
      - name: Free disk space by removing preinstalled packages
        uses: jlumbroso/free-disk-space@main

      # ---- hax, built from this checkout; it downloads charon and aeneas
      # into its own tool cache. Same setup as `fstar-build` below and as the
      # `examples` job of `examples.yml`, which also runs
      # `cargo hax into lean`.
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: hax
          skipPush: true

      - name: Install hax + rustc
        working-directory: ${{ github.workspace }}
        run: |
          nix profile install .#rustc
          nix profile install .

      - name: Install elan
        # Bypass elan-init.sh: it does its own curl with no retries, so a
        # transient 502 from github.com/.../releases/latest/download/...
        # fails the whole job. Download the tarball ourselves with curl
        # retries, then run the bundled elan-init binary directly.
        run: |
          set -euo pipefail
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/elan.tar.gz \
            https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      # NOTE: no Lean/mathlib or cargo cache here — a cache that size crowds
      # everything else out of the 10 GiB per-repo cap.

      # ---- The actual pipeline ------------------------------------------
      # Only the core-models library extraction + build. The `tests/`
      # crates run in the `core-models-tests` job below (it has already
      # been refactored to use `cargo hax into lean`).
      - name: Extract Lean library, build Lean library
        run: |
          unset CI # Allows us to use Aeneas's olean cache
          make lean

      # The `Tests` lean_lib is deliberately excluded from `defaultTargets`
      # (library consumers should not pay for it), so the `lake build` above
      # skips it. Build it explicitly here to keep the end-to-end tactic
      # tests (e.g. the signed for_loop_with_invariant specs) green.
      - name: Build Lean tactic tests
        working-directory: hax-lib/proof-libs/lean
        run: lake build Tests

      # ---- Enforce that committed extraction matches re-extraction ------
      # If this fails: someone changed Rust source / patcher without
      # re-running `make lean` and committing the resulting diff.
      # Whole tree, not a file list: `git diff` on a pathspec matching
      # nothing exits 0, so a list goes stale silently.
      - name: Committed extraction must match a fresh re-extraction
        run: |
          if [ -n "$(git status --porcelain -- ../proof-libs/lean)" ]; then
            echo "::error::Committed Lean extraction is stale — run 'make lean' in hax-lib/core-models and commit the result."
            git status --porcelain -- ../proof-libs/lean
            git diff -- ../proof-libs/lean
            exit 1
          fi

  fstar-build:
    name: "core-models: fstar"
    runs-on: ubuntu-latest
    needs: [changes, rust-fmt]
    if: needs.changes.outputs.relevant == 'true'
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: cachix/cachix-action@v15
        with:
          name: hax
          skipPush: true
          extraPullNames: fstar-nix-versions, z3-nix-versions

      - name: Install hax + rustc
        run: |
          nix profile install .#rustc
          nix profile install .

      - name: F* extraction of core-models
        run: make -C hax-lib/core-models fstar

      - name: Committed F* extraction must match a fresh re-extraction
        run: |
          if [ -n "$(git status --porcelain -- hax-lib/proof-libs/fstar/core)" ]; then
            echo "::error::Committed F* extraction is stale — run 'make fstar' in hax-lib/core-models and commit the result."
            git status --porcelain -- hax-lib/proof-libs/fstar/core
            git diff -- hax-lib/proof-libs/fstar/core
            exit 1
          fi

      - name: F* library type-checks
        run: nix develop .#fstar --command make -C hax-lib/proof-libs/fstar/core

  core-models-tests:
    name: "core-models: tests"
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space by removing preinstalled packages
      uses: jlumbroso/free-disk-space@main
    - uses: DeterminateSystems/nix-installer-action@main
    - uses: cachix/cachix-action@v15
      with:
        name: hax
        skipPush: true
        extraPullNames: fstar-nix-versions, z3-nix-versions

    - name: Build & run the core-models tests
      run: |
        unset CI # Allows us to use Aeneas's olean cache
        nix develop .#ci-examples --command make -C hax-lib/core-models/tests clean
        nix develop .#ci-examples --command make -C hax-lib/core-models/tests

    # Inverted: a `skip_lean` test that PASSES means its blocker is gone.
    # Runs here, not in `lean-build`: `check-skipped` re-extracts with
    # `cargo hax`, which only this job's nix shell provides.
    - name: Skipped equivalence tests must still be failing
      run: |
        unset CI
        nix develop .#ci-examples --command \
          make -C hax-lib/core-models/tests/rust_lean_equiv_test check-skipped

  result:
    name: "core-models: result"
    needs: [changes, rust-fmt, rust-test, test-coverage, lean-build, fstar-build, core-models-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/check-results
        with:
          results: ${{ join(needs.*.result, ' ') }}
          allow-skipped: ${{ needs.changes.outputs.relevant != 'true' }}

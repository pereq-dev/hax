name: Clippy

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  clippy:
    name: "clippy: check"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install clippy
      run: |
        rustup component add clippy
    - name: Run clippy on the Rust engine
      run: |
        cargo clippy -p hax-rust-engine -- -D warnings --no-deps
    - name: Run clippy on cargo-hax
      run: |
        cargo clippy -p cargo-hax --no-deps --all-targets --all-features -- -D warnings

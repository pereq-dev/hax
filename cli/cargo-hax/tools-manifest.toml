# Version manifest of hax's managed external tools, embedded into the
# `cargo-hax` binary at build time.
#
# It maps tool name, version, and platform to a download URL and SHA-256
# checksum, plus `entry_points` where the archive layout deviates from the
# `bin/<name>` convention. Only versions listed here install with checksum
# verification; other versions go through the `[fallback]` templates below,
# unverified and with a warning.
#
# Entries are only added, never removed: every version ever published stays
# installable with verification on the supported platforms. Append new versions
# at the end of their tool's section: file order is release order, and
# `tools list` relies on it. Adding a version is a single reviewed
# commit; generate its entries with `just add-tool-version <tool> <version>`,
# which hashes the artifacts themselves and checks them the way an install
# does, and record the provenance in a comment when it is not obvious from
# the URL.
#
# The `tools_manifest` CI workflow checks these entries against the artifacts
# they name: a pull request touching this file verifies every version listed
# here, the nightly run verifies the defaults and checks the rest still resolve.


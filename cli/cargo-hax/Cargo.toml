[package]
name = "cargo-hax"
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "README.md"
build = "build.rs"
description = "The high assurance translation toolchain"

[[bin]]
path = "src/cargo_hax.rs"
name = "cargo-hax"

[[bin]]
path = "src/json_schema.rs"
name = "hax-export-json-schemas"
required-features = ["legacy-engine"]

# Fixtures the integration tests share, not a test target of its own.
[[test]]
path = "tests/common.rs"
name = "common"
test = false

[features]
# Builds `hax-export-json-schemas`, which the OCaml engine's build consumes.
# The schemas describe the engine protocol, whose types come from
# `hax-rust-engine`: hence that build-dependency. `hax-rust-engine` only
# compiles on the nightly toolchain hax pins, so this feature is off by
# default, leaving `cargo install cargo-hax` to build on any recent toolchain.
legacy-engine = [
    "dep:hax-rust-engine",
    "dep:hax-lib-macros-types",
    "dep:hax-frontend-exporter",
    "dep:hax-types",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
itertools.workspace = true
clap.workspace = true
paste = "1.0.11"
hax-frontend-exporter.workspace = true
hax-frontend-exporter-options.workspace = true
hax-types.workspace = true
path-clean = "1.0.1"
tempfile = "3.8"
which.workspace = true
version_check = "0.9"
rustup-toolchain = "0.1"
colored.workspace = true
is-terminal = "0.4.9"
tiny_http = "0.12"
annotate-snippets.workspace = true
serde-jsonlines = "0.5.0"
prettyplease = "0.2.20"
syn = { version = "2.*", features = ["full"] }
cargo_metadata.workspace = true
extension-traits = "1.0.1"
shlex = "1.3"
toml = "0.8"
toml_edit = "0.22"
ureq = "2.10"
# The TLS roots the downloader trusts: the bundled set, plus the platform's
# own store. Kept on the versions `ureq` links, so that its
# `tls_config` takes the `rustls::ClientConfig` built here.
rustls = { version = "0.23.19", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "0.26"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zstd = "0.13.1"
hex = "0.4"
indicatif = "0.18.0"

# Everything the JSON schema needs is optional, leaving the build script of a
# default build with `version_check` and `toml` alone.
[build-dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
hax-types = { workspace = true, optional = true }
hax-rust-engine = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
hax-frontend-exporter = { workspace = true, optional = true }
hax-lib-macros-types = { workspace = true, features = ["schemars"], optional = true }
version_check = "0.9"
toml = "0.8"

# Where `cargo binstall cargo-hax` looks for a pre-built binary. The templates it
# would try by default assume a `v{version}` tag, which this repository does not
# use; `{ target }` is a target triple, so the release assets are named after one,
# and they hold the binary at the archive root. The archives carry `cargo-hax`
# alone: `hax-export-json-schemas` needs a feature, which makes it optional here.
#
# `cargo binstall` reads this from the manifest published to crates.io, so a
# version is binstallable only if it was published with these keys and its
# release carries the assets they name.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/cargo-hax-v{ version }/cargo-hax-{ target }.tar.zst"
pkg-fmt = "tzstd"
bin-dir = "{ bin }{ binary-ext }"

[[package.metadata.release.pre-release-replacements]]
file = "../../engine/dune-project"
search = "version [a-z0-9\\.-]+"
replace = "version {{version}}"
prerelease = true

# `hax-engine.opam` is generated by dune from `dune-project`; a version bump
# only changes this line, so it is rewritten directly and the bump needs no
# dune. CI checks that the file never diverges from `dune-project`.
[[package.metadata.release.pre-release-replacements]]
file = "../../engine/hax-engine.opam"
search = "(?m)^version: \"[a-z0-9\\.-]+\""
replace = "version: \"{{version}}\""
prerelease = true

# The FLS results record the hax version they were observed with, which is
# always the version of the checkout.
[[package.metadata.release.pre-release-replacements]]
file = "../../tests/fls-results/lean.toml"
search = "(?m)^hax = \"[a-z0-9\\.-]+\""
replace = "hax = \"{{version}}\""
exactly = 1
prerelease = true

# Turns the `[Unreleased]` changelog section into the release's section. A
# bump without that section fails here: recreate the header, with the entries
# the release should carry, and bump again. Unlike the version replacements
# above, this one stays at the `prerelease = false` default: a pre-release
# bump keeps `[Unreleased]` in place for the eventual stable release.
[[package.metadata.release.pre-release-replacements]]
file = "../../CHANGELOG.md"
search = "## \\[Unreleased\\]"
replace = "## [{{version}}] - {{date}}"
exactly = 1

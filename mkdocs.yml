site_name: hax
repo_url: https://github.com/pereq-dev/hax
site_url: https://hax.cryspen.com
site_author: Cryspen
repo_name: GitHub
theme:
  name: material
  logo: static/img/logo.png
  favicon: static/img/favicon.png
  custom_dir: docs/overrides
  palette:
    primary: white
  features:
    - content.code.copy
    - content.code.select
    - content.code.annotate
    - content.footnote.tooltips
    - navigation.sections
    - navigation.path
    - navigation.tabs
    - header.autohide
    - navigation.instant
    - navigation.indexes
  icon:
    repo: fontawesome/brands/github
extra_javascript:
  - javascripts/hax_playground.js
  - javascripts/ansi_up.js
  - javascripts/fstar.js
  - javascripts/lz-string.js
extra_css:
  - stylesheets/hax_playground.css
  - stylesheets/logo.css
markdown_extensions:
  - attr_list
  - tables
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.blocks.html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Fail the build on a missing snippet file or section instead of
      # silently expanding it to nothing.
      check_paths: true
  - pymdownx.keys
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
plugins:
  - glightbox
  - search
  - blog
  - awesome-nav
  - mkdocs-nav-weight

# Paragraphs of the identifier lists that no test covers, per chapter and
# category, with the reason. The categories are lexical, legality,
# out-of-scope, unsafe, ffi, inline-assembly, concurrency, and
# macro-expanded. The `informational` and `pending` categories are computed
# by `test-driver tests fls coverage` from the flags of the identifier lists
# and from `pending-chapters`; they are not written here.
#
# A chapter listed in `pending-chapters` has no tables. The pull request that
# completes the triage of a chapter removes it from the list and adds its tables.

pending-chapters = [
  "lexical-elements",
  "functions",
  "associated-items",
  "implementations",
  "generics",
  "attributes",
  "entities-and-resolution",
  "ownership-and-deconstruction",
  "exceptions-and-errors",
  "concurrency",
  "program-structure-and-compilation",
  "unsafety",
  "macros",
  "ffi",
  "inline-assembly",
  "hax",
]

[items.out-of-scope]
reason = "Elaboration describes when a declaration takes effect at runtime; the value model has no runtime events to observe."
ids = ["fls_hil5f7y4xdhe"]

[items.macro-expanded]
reason = "Macro invocations in item position are expanded before the program reaches charon; the suite tests the expansion, not the invocation."
ids = ["fls_s3b1cba9lfj5"]

